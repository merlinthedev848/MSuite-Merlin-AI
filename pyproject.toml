[tool.ruff]
line-length = 140
target-version = "py310"
exclude = [".venv", ".venv-dev", "__pycache__", "data", "models", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM105", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
